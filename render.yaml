# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy via: New + → Blueprint → connect this repo → Apply
services:
  - type: web
    name: life-on-track-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
      - key: CORS_ORIGIN
        sync: false
